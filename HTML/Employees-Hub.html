<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-slate-800 text-white p-6 flex justify-between items-center shadow-md">
        <div class="text-2xl font-bold tracking-tight">Employees Hub</div>
        <nav class="flex space-x-6">
            <a href="#" data-section="dashboard" class="text-white hover:text-sky-300 transition-colors duration-300 flex items-center gap-2">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="#" data-section="directory" class="text-white hover:text-sky-300 transition-colors duration-300 flex items-center gap-2">
                <i class="fas fa-users"></i> Directory
            </a>
            <a href="#" data-section="announcements" class="text-white hover:text-sky-300 transition-colors duration-300 flex items-center gap-2">
                <i class="fas fa-bullhorn"></i> Announcements
            </a>
            <a href="#" data-section="resources" class="text-white hover:text-sky-300 transition-colors duration-300 flex items-center gap-2">
                <i class="fas fa-link"></i> Resources
            </a>
            <a href="#" data-section="settings" class="text-white hover:text-sky-300 transition-colors duration-300 flex items-center gap-2">
                <i class="fas fa-cog"></i> Settings
            </a>
        </nav>
    </header>

    <main id="content-area" class="p-8 max-w-7xl mx-auto">
        </main>

    <script src="script.js"></script>
</body>
</html>
